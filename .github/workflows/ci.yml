name: CI

on:
    pull_request:
        branches:
            - main
            - master
            - dev
    push:
        branches:
            - main
            - master
            - dev

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    unit-tests:
        name: Unit Tests
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "26.13.0"
                  cache: "npm"

            - name: Install npm
              run: npm install -g npm@11.20.0

            - name: Install dependencies
              run: npm ci

            - name: Run unit and integration tests
              run: npm run test

            - name: Run tests with coverage
              run: npm run test:coverage

            - name: Upload coverage report
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: coverage/
                  retention-days: 7

    code-quality:
        name: Code Quality
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "26.13.0"
                  cache: "npm"

            - name: Install npm
              run: npm install -g npm@11.20.0

            - name: Install dependencies
              run: npm ci

            - name: TypeScript type check
              run: npx tsc --noEmit

            - name: ESLint check
              run: npm run lint

    production-build:
        name: Production Build
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "26.13.0"
                  cache: "npm"

            - name: Install npm
              run: npm install -g npm@11.20.0

            - name: Install dependencies
              run: npm ci

            - name: Next.js production build
              run: npm run build
              env:
                  NEXT_PUBLIC_APP_URL: http://localhost:3000
                  NEXT_PUBLIC_ENCRYPTION_KEY: ci-placeholder-key-do-not-use-in-production
                  BACKEND_URL: http://localhost:8080
